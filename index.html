<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css?v=5">

    <title>وِجهة | WIJHA</title>
</head>

<body>

    <!-- =========================
         Top Navigation
    ========================== -->

    <header class="top-bar">

        <div class="brand">
            <img src="assets/images/wijha-logo.jpg" alt="شعار وِجهة">
            <span>الصفحة الرئيسية</span>
        </div>

        <div class="top-actions">
            <button aria-label="الإشعارات">🔔</button>
            <button aria-label="الوضع الليلي">🌙</button>
        </div>

    </header>


    <!-- =========================
         Home Intro
    ========================== -->

    <section class="home-intro">

        <p class="home-eyebrow">
            دليلك للحياة الجامعية
        </p>

        <h1>وِجهة</h1>

    </section>


    <!-- =========================
         Main Shortcuts
    ========================== -->

    <section class="main-shortcuts">

        <a href="#" class="main-card">

            <div class="card-icon">
                ↗
            </div>

            <h2>
                الأنظمة الجامعية
            </h2>

            <p>
                الوصول للمنصات الرسمية
            </p>

        </a>


        <a href="#" class="main-card main-card-dark">

            <div class="card-icon">
                ⌗
            </div>

            <h2>
                الأدوات الأكاديمية
            </h2>

            <p>
                أدوات تساعدك في دراستك
            </p>

        </a>


        <a href="#" class="secondary-card">

            <div class="secondary-icon">
                📚
            </div>

            <h3>
                مكتبة الطالب
            </h3>

        </a>


        <a href="#" class="secondary-card">

            <div class="secondary-icon">
                🎓
            </div>

            <h3>
                الكليات والتخصصات
            </h3>

        </a>

    </section>


    <!-- =========================
         Upcoming Events
    ========================== -->

    <section class="upcoming-section">

        <div class="section-heading">

            <h2>
                الأحداث القادمة
            </h2>

            <span>
                📅
            </span>

        </div>


        <div
            class="event-card"
            id="next-event"
            data-date="2026-09-23T00:00:00+03:00"
        >

            <div class="event-top">

                <div>

                    <p class="event-label">
                        الحدث القادم
                    </p>

                    <h3>
                        اليوم الوطني السعودي
                    </h3>

                </div>


                <div class="event-date">
                    23 سبتمبر 2026
                </div>

            </div>


            <div class="countdown">

                <div class="time-box">

                    <strong id="days">
                        00
                    </strong>

                    <span>
                        يوم
                    </span>

                </div>


                <div class="time-box">

                    <strong id="hours">
                        00
                    </strong>

                    <span>
                        ساعة
                    </span>

                </div>


                <div class="time-box">

                    <strong id="minutes">
                        00
                    </strong>

                    <span>
                        دقيقة
                    </span>

                </div>

            </div>


            <a href="#" class="event-link">

                عرض التقويم الأكاديمي

                <span>
                    ←
                </span>

            </a>

        </div>

    </section>


    <!-- JavaScript -->

    <script src="js/main.js?v=1"></script>

</body>

</html>
